name: Keep Supabase Alive

on:
  schedule:
    # Run every 3 days at midnight UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from the Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Error: SUPABASE_URL or SUPABASE_ANON_KEY secret is not set in GitHub Repository Secrets."
            exit 1
          fi
          
          echo "Sending keep-alive ping to Supabase Database..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/contact_submissions?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
            
          echo "Response HTTP Status Code: $STATUS_CODE"
          # Any response from PostgREST (2xx, 401, 403, 406 etc.) proves database/API activity
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 500 ]; then
            echo "Ping successful! Supabase API responded, database activity registered."
          else
            echo "Error: Unexpected status code $STATUS_CODE from Supabase"
            exit 1
          fi
